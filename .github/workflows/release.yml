name: Build

on:
  push:
    branches: ['**']
    tags:
      - 'release/*'
  pull_request:
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} PortionOfScreen.sln

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: PortionOfScreen
        path: x64/Release/PortionOfScreen.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/release/')
      run: |
        $GIT_VER = $env:GITHUB_REF -replace '.*/',''
        echo "GIT_VER=$GIT_VER"
        gh release create "release/$GIT_VER" --title "PortionOfScreen $GIT_VER" x64/Release/PortionOfScreen.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
